<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniChart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-base: #0d0e11;
      --bg-sec: #2c3539;
      --bg-sec-hover: #364146;
      --border-sec: #3d494f;
      --accent: #ff9f1c;
      --accent-hover: #ffb144;
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-base);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d0e11; }
    ::-webkit-scrollbar-thumb { background: #3d494f; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #ff9f1c; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#0d0e11] text-slate-100 antialiased selection:bg-[#ff9f1c] selection:text-[#0d0e11]">

  <!-- TOP NAVIGATION BAR -->
  <header class="sticky top-0 z-30 bg-[#0d0e11]/95 backdrop-blur border-b border-[#3d494f]">
    <div class="max-w-[1600px] mx-auto px-4 h-14 flex items-center justify-between gap-3">
      
      <!-- Left: Black Tome Menu Trigger + Brand -->
      <div class="relative flex items-center gap-2.5">
        <button
          id="tomeMenuBtn"
          data-action="toggle-tome-menu"
          title="Open Navigation Menu"
          class="group flex items-center gap-2.5 px-2 py-1.5 rounded-lg bg-[#2c3539] hover:bg-[#364146] border border-[#3d494f] hover:border-[#ff9f1c] transition"
        >
          <svg class="w-6 h-6 shrink-0" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="3" width="20" height="22" rx="2.5" fill="#0d0e11" stroke="#ff9f1c" stroke-width="1.8"/>
            <path d="M8 3V25" stroke="#ff9f1c" stroke-width="1.4"/>
            <rect x="11" y="7" width="9" height="1.8" rx="0.9" fill="#f8fafc"/>
            <rect x="11" y="11" width="6" height="1.5" rx="0.75" fill="#94a3b8"/>
            <path d="M21 22H8C6.89543 22 6 22.8954 6 24" stroke="#f8fafc" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span class="font-bold tracking-tight text-white text-base">OmniChart</span>
          <svg class="w-3.5 h-3.5 text-slate-400 group-hover:text-[#ff9f1c] transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <!-- TOME POPUP MENU -->
        <div
          id="tomeDropdown"
          class="hidden absolute left-0 top-12 w-60 rounded-xl bg-[#2c3539] border border-[#3d494f] shadow-2xl p-1.5 z-50"
        >
          <div class="px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wider text-slate-400 border-b border-[#3d494f]/70 mb-1">
            Switch View
          </div>
          <button
            data-action="switch-view"
            data-view="library"
            id="menuViewLibrary"
            class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition"
          >
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
              Library
            </span>
            <span id="menuLibraryCount" class="text-xs px-1.5 py-0.5 rounded bg-[#0d0e11] text-slate-300">0</span>
          </button>

          <button
            data-action="switch-view"
            data-view="calendar"
            id="menuViewCalendar"
            class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition mt-0.5"
          >
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              Calendar
            </span>
            <span id="menuCalendarCount" class="text-xs px-1.5 py-0.5 rounded bg-[#0d0e11] text-[#ff9f1c]">0</span>
          </button>

          <div class="border-t border-[#3d494f]/70 my-1.5"></div>
          <button
            data-action="enrich-library"
            class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium text-[#ff9f1c] hover:bg-[#ff9f1c]/15 transition"
          >
            <span class="flex items-center gap-2.5">⚡ Enrich Metadata</span>
            <span class="text-[10px] uppercase px-1.5 py-0.5 rounded bg-[#0d0e11] text-[#ff9f1c]">Auto</span>
          </button>
          <button
            data-action="toggle-bulk-mode"
            class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium text-rose-300 hover:bg-rose-500/15 transition mt-0.5"
          >
            <span class="flex items-center gap-2.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
              Mass Removal
            </span>
            <span class="text-[10px] uppercase px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300">Bulk</span>
          </button>
        </div>
      </div>

      <!-- Center: Category Pills -->
      <nav id="categoryNav" class="flex items-center gap-1 overflow-x-auto no-scrollbar py-1"></nav>

      <!-- Right: Search + Add Media -->
      <div class="flex items-center gap-2">
        <div class="relative w-44 sm:w-60">
          <input
            id="librarySearchInput"
            type="text"
            placeholder="Search library..."
            class="w-full h-9 pl-8 pr-7 rounded-lg bg-[#2c3539] border border-[#3d494f] text-sm text-white placeholder-slate-400 focus:outline-none focus:border-[#ff9f1c]"
          />
          <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <button
            id="clearLibrarySearchBtn"
            data-action="clear-library-search"
            class="hidden absolute right-2 top-2 text-slate-400 hover:text-white text-xs"
          >✕</button>
        </div>

        <button
          data-action="open-add-modal"
          class="h-9 px-3.5 rounded-lg bg-[#ff9f1c] hover:bg-[#ffb144] text-[#0d0e11] font-bold text-sm flex items-center gap-1.5 shrink-0 transition shadow"
        >
          <span>+</span>
          <span class="hidden sm:inline">Add Media</span>
        </button>
      </div>
    </div>
  </header>

  <!-- SUB-HEADER BAR (LIBRARY CONTROLS) -->
  <section id="librarySubHeader" class="bg-[#2c3539]/60 border-b border-[#3d494f]">
    <div class="max-w-[1600px] mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2">
      <!-- Status Tabs -->
      <div id="statusTabs" class="flex items-center gap-1 overflow-x-auto no-scrollbar"></div>

      <!-- Right Tools: Sort + Enrich + Mass Remove + Export/Import -->
      <div class="flex items-center gap-2 ml-auto">
        <select
          id="sortSelect"
          class="h-8 px-2.5 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-xs text-slate-200 focus:outline-none focus:border-[#ff9f1c]"
        >
          <option value="rating-desc">Sort: Rating (High → Low)</option>
          <option value="updated-desc">Sort: Recently Updated</option>
          <option value="title-asc">Sort: Title (A → Z)</option>
          <option value="progress-desc">Sort: Progress</option>
        </select>

        <button
          id="enrichBtn"
          data-action="enrich-library"
          title="Auto-fill missing Studio, Release Date, Genres, and Synopsis for all library entries"
          class="h-8 px-2.5 rounded-lg bg-[#0d0e11] hover:bg-[#2c3539] border border-[#ff9f1c]/50 text-xs text-[#ff9f1c] font-semibold flex items-center gap-1.5 transition"
        >
          <span>⚡</span>
          <span class="hidden sm:inline">Enrich Metadata</span>
        </button>

        <button
          id="bulkModeBtn"
          data-action="toggle-bulk-mode"
          title="Mass Removal Mode"
          class="h-8 px-2.5 rounded-lg bg-[#0d0e11] hover:bg-rose-950/60 border border-[#3d494f] hover:border-rose-500/60 text-xs text-slate-200 hover:text-rose-200 flex items-center gap-1.5 transition"
        >
          <svg class="w-3.5 h-3.5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          <span class="hidden sm:inline">Mass Remove</span>
        </button>

        <button
          data-action="export-json"
          title="Export Library JSON"
          class="h-8 px-2.5 rounded-lg bg-[#0d0e11] hover:bg-[#2c3539] border border-[#3d494f] text-xs text-slate-200 flex items-center gap-1 transition"
        >
          <svg class="w-3.5 h-3.5 text-[#ff9f1c]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4"/>
          </svg>
          <span class="hidden md:inline">Export</span>
        </button>

        <label
          title="Import Library JSON"
          class="h-8 px-2.5 rounded-lg bg-[#0d0e11] hover:bg-[#2c3539] border border-[#3d494f] text-xs text-slate-200 flex items-center gap-1 cursor-pointer transition"
        >
          <svg class="w-3.5 h-3.5 text-[#ff9f1c]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M16 8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          <span class="hidden md:inline">Import</span>
          <input id="importFileInput" type="file" accept=".json,application/json" class="hidden" />
        </label>
      </div>
    </div>
  </section>

  <!-- LIVE METADATA ENRICHER PROGRESS BANNER -->
  <section id="enrichBanner" class="hidden bg-[#2c3539] border-b border-[#ff9f1c]/50">
    <div class="max-w-[1600px] mx-auto px-4 py-2 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2.5 min-w-0">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#ff9f1c] animate-ping shrink-0"></span>
        <span id="enrichStatusText" class="text-xs font-semibold text-white truncate">
          Enriching library with Studio, Release Date, Genres & Synopsis...
        </span>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <div class="w-36 sm:w-52 h-2 rounded-full bg-[#0d0e11] overflow-hidden border border-[#3d494f]">
          <div id="enrichProgressBar" class="h-full bg-[#ff9f1c] transition-all duration-300" style="width: 0%"></div>
        </div>
        <button
          data-action="stop-enrich"
          class="text-[11px] px-2 py-0.5 rounded bg-[#0d0e11] hover:bg-rose-950 text-slate-300 hover:text-rose-300 border border-[#3d494f]"
        >Stop</button>
      </div>
    </div>
  </section>

  <!-- MASS REMOVAL TOOLBAR -->
  <section id="bulkToolbar" class="hidden bg-rose-950/30 border-b border-rose-500/40">
    <div class="max-w-[1600px] mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-xs font-bold uppercase tracking-wider px-2 py-1 rounded bg-rose-500/20 text-rose-300 border border-rose-500/30">
          Mass Removal Mode
        </span>
        <span id="bulkSelectedCount" class="text-xs text-slate-200 font-medium">0 selected</span>
        <div class="h-4 w-px bg-[#3d494f] mx-1"></div>
        <button
          data-action="bulk-select-visible"
          class="h-7 px-2.5 rounded bg-[#2c3539] hover:bg-[#364146] border border-[#3d494f] text-xs text-slate-100 transition"
        >Select All Shown</button>
        <button
          data-action="bulk-deselect-all"
          class="h-7 px-2.5 rounded bg-[#2c3539] hover:bg-[#364146] border border-[#3d494f] text-xs text-slate-300 transition"
        >Deselect All</button>
        <button
          data-action="bulk-select-broken"
          title="Select items with placeholder titles like 'TV (JP)Released' or 'Streaming...'"
          class="h-7 px-2.5 rounded bg-[#2c3539] hover:bg-[#364146] border border-[#ff9f1c]/40 text-xs text-[#ff9f1c] transition"
        >Select Broken Titles</button>
        <button
          data-action="bulk-select-unrated"
          class="h-7 px-2.5 rounded bg-[#2c3539] hover:bg-[#364146] border border-[#3d494f] text-xs text-slate-200 transition"
        >Select Unrated (0★)</button>
      </div>

      <div class="flex items-center gap-2">
        <button
          data-action="bulk-delete-selected"
          class="h-8 px-3 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs flex items-center gap-1.5 transition shadow"
        >
          <span>Delete Selected</span>
        </button>
        <button
          data-action="bulk-delete-filtered"
          class="h-8 px-3 rounded-lg bg-rose-900/70 hover:bg-rose-800 text-rose-100 border border-rose-500/40 font-semibold text-xs transition"
        >
          Delete All Shown
        </button>
        <button
          data-action="bulk-wipe-all"
          class="h-8 px-3 rounded-lg bg-[#0d0e11] hover:bg-rose-950 text-rose-400 border border-rose-500/40 font-semibold text-xs transition"
        >
          Wipe Library
        </button>
        <button
          data-action="toggle-bulk-mode"
          class="h-8 px-2.5 rounded-lg bg-[#2c3539] hover:bg-[#364146] text-xs text-slate-200 transition"
        >
          Done
        </button>
      </div>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main class="max-w-[1600px] mx-auto px-4 py-5">
    
    <!-- LIBRARY VIEW -->
    <div id="libraryView">
      <div id="mediaGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </div>

    <!-- CALENDAR VIEW -->
    <div id="calendarView" class="hidden space-y-4">
      <div class="bg-[#2c3539] border border-[#3d494f] rounded-xl p-4 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <button
            data-action="cal-prev-month"
            class="h-9 w-9 rounded-lg bg-[#0d0e11] hover:bg-[#364146] border border-[#3d494f] flex items-center justify-center text-slate-200"
          >‹</button>
          <h2 id="calendarMonthLabel" class="text-lg font-bold text-white min-w-[160px] text-center"></h2>
          <button
            data-action="cal-next-month"
            class="h-9 w-9 rounded-lg bg-[#0d0e11] hover:bg-[#364146] border border-[#3d494f] flex items-center justify-center text-slate-200"
          >›</button>
          <button
            data-action="cal-today"
            class="h-9 px-3 rounded-lg bg-[#0d0e11] hover:bg-[#364146] border border-[#3d494f] text-xs font-semibold text-[#ff9f1c]"
          >Today</button>
        </div>

        <div class="flex items-center gap-3 text-xs text-slate-300">
          <span class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-[#ff9f1c]"></span> Single Date (DAY)
          </span>
          <span class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> Range Start (START)
          </span>
          <span class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-sky-400"></span> Range End (END)
          </span>
        </div>
      </div>

      <div id="calendarJumpBar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1"></div>

      <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold uppercase tracking-wider text-slate-400 px-1">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>

      <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
    </div>

  </main>

  <!-- ADD / EDIT MEDIA MODAL -->
  <div
    id="mediaModal"
    class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4"
  >
    <div class="bg-[#2c3539] border border-[#3d494f] rounded-2xl w-full max-w-2xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-5 py-3.5 border-b border-[#3d494f] flex items-center justify-between bg-[#0d0e11]/60">
        <h3 id="modalTitle" class="font-bold text-base text-white">Add Media</h3>
        <button data-action="close-modal" class="text-slate-400 hover:text-white text-lg leading-none">✕</button>
      </div>

      <div class="p-5 overflow-y-auto space-y-4 text-sm">
        <!-- Clean Auto-Search Bar -->
        <div class="relative">
          <input
            id="autoSearchInput"
            type="text"
            placeholder="Search title to auto-fill..."
            autocomplete="off"
            class="w-full h-10 pl-9 pr-20 rounded-xl bg-[#0d0e11] border border-[#3d494f] text-white placeholder-slate-400 focus:outline-none focus:border-[#ff9f1c]"
          />
          <svg class="w-4 h-4 text-[#ff9f1c] absolute left-3 top-3 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <span id="autoSearchStatus" class="absolute right-3 top-2.5 text-xs text-slate-400"></span>
          <div
            id="autoSearchResults"
            class="hidden absolute left-0 right-0 top-11 max-h-72 overflow-y-auto rounded-xl bg-[#0d0e11] border border-[#3d494f] shadow-2xl z-20 divide-y divide-[#3d494f]/60"
          ></div>
        </div>

        <input type="hidden" id="fieldId" />

        <!-- Poster Preview + Main Fields -->
        <div class="grid grid-cols-1 sm:grid-cols-[130px_1fr] gap-4">
          <div class="flex flex-col gap-2">
            <div class="w-[130px] h-[190px] rounded-xl bg-[#0d0e11] border border-[#3d494f] overflow-hidden flex items-center justify-center mx-auto sm:mx-0">
              <img id="modalPosterPreview" src="" alt="Poster" class="w-full h-full object-cover hidden" />
              <span id="modalPosterPlaceholder" class="text-xs text-slate-500 text-center px-2">No Poster</span>
            </div>
            <label class="text-center text-xs py-1.5 px-2 rounded-lg bg-[#0d0e11] hover:bg-[#364146] border border-[#3d494f] text-slate-300 cursor-pointer transition">
              Upload Image
              <input id="posterUploadInput" type="file" accept="image/*" class="hidden" />
            </label>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block text-xs text-slate-300 mb-1">Title *</label>
              <input id="fieldTitle" type="text" required class="w-full h-9 px-3 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]" />
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs text-slate-300 mb-1">Category</label>
                <select id="fieldCategory" class="w-full h-9 px-2.5 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]">
                  <option value="Series & Anime">Series & Anime</option>
                  <option value="Movies">Movies</option>
                  <option value="Games">Games</option>
                  <option value="Books">Books</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-300 mb-1">Status</label>
                <select id="fieldStatus" class="w-full h-9 px-2.5 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]">
                  <option value="Watching">Watching / Playing</option>
                  <option value="Completed">Completed</option>
                  <option value="On Hold">On Hold</option>
                  <option value="Plan to Watch">Plan to Watch</option>
                  <option value="Dropped">Dropped</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2.5">
              <div>
                <label class="block text-xs text-slate-300 mb-1">Rating (0–10)</label>
                <input id="fieldRating" type="number" min="0" max="10" step="0.5" value="0" class="w-full h-9 px-2.5 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]" />
              </div>
              <div>
                <label class="block text-xs text-slate-300 mb-1">Progress</label>
                <input id="fieldProgress" type="number" min="0" value="0" class="w-full h-9 px-2.5 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]" />
              </div>
              <div>
                <label class="block text-xs text-slate-300 mb-1">Total Units</label>
                <input id="fieldTotalUnits" type="number" min="1" value="12" class="w-full h-9 px-2.5 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]" />
              </div>
            </div>
          </div>
        </div>

        <!-- Studio, Release Year & Date / Range -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs text-slate-300 mb-1">Studio / Creator</label>
            <input id="fieldStudio" type="text" placeholder="e.g. MAPPA, Bones" class="w-full h-9 px-3 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]" />
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">Release Date</label>
            <input id="fieldReleaseDate" type="text" placeholder="e.g. Fall 2023" class="w-full h-9 px-3 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]" />
          </div>
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs text-[#ff9f1c] font-semibold">Date / Range</label>
              <div class="flex items-center gap-1">
                <button type="button" data-action="fill-today-date" class="text-[10px] px-1.5 py-0.5 rounded bg-[#0d0e11] border border-[#3d494f] text-slate-300 hover:text-white">Today</button>
                <button type="button" data-action="append-date-to" class="text-[10px] px-1.5 py-0.5 rounded bg-[#0d0e11] border border-[#3d494f] text-slate-300 hover:text-white">+ to</button>
              </div>
            </div>
            <input id="fieldConsumedDate" type="text" placeholder="DD-MM-YYYY or DD-MM-YYYY to DD-MM-YYYY" class="w-full h-9 px-3 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]" />
          </div>
        </div>

        <!-- Image URL + Genres -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-300 mb-1">Thumbnail URL</label>
            <input id="fieldImage" type="text" placeholder="https://..." class="w-full h-9 px-3 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]" />
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">Genres (comma-separated)</label>
            <input id="fieldGenres" type="text" placeholder="Action, Sci-Fi, Drama" class="w-full h-9 px-3 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]" />
          </div>
        </div>

        <!-- Review / Notes & Synopsis -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-300 mb-1">My Review / Notes</label>
            <textarea id="fieldNotes" rows="3" placeholder="Your thoughts..." class="w-full p-2.5 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]"></textarea>
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">Synopsis</label>
            <textarea id="fieldSynopsis" rows="3" placeholder="Plot summary..." class="w-full p-2.5 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-white focus:outline-none focus:border-[#ff9f1c]"></textarea>
          </div>
        </div>
      </div>

      <div class="px-5 py-3 border-t border-[#3d494f] bg-[#0d0e11]/60 flex items-center justify-end gap-2">
        <button data-action="close-modal" class="h-9 px-4 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-xs font-semibold text-slate-300 hover:text-white">
          Cancel
        </button>
        <button data-action="save-media" class="h-9 px-5 rounded-lg bg-[#ff9f1c] hover:bg-[#ffb144] text-[#0d0e11] text-xs font-bold shadow">
          Save Entry
        </button>
      </div>
    </div>
  </div>

  <!-- CONFIRMATION MODAL (FOR MASS REMOVAL) -->
  <div
    id="confirmModal"
    class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
  >
    <div class="bg-[#2c3539] border border-[#3d494f] rounded-2xl w-full max-w-md p-5 shadow-2xl space-y-4">
      <div class="flex items-start gap-3">
        <div class="w-9 h-9 rounded-lg bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400 shrink-0 font-bold">!</div>
        <div>
          <h4 id="confirmModalTitle" class="font-bold text-white text-base">Confirm Removal</h4>
          <p id="confirmModalMessage" class="text-xs text-slate-300 mt-1 leading-relaxed"></p>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2 border-t border-[#3d494f]">
        <button data-action="close-confirm-modal" class="h-8 px-3.5 rounded-lg bg-[#0d0e11] border border-[#3d494f] text-xs text-slate-300 hover:text-white">
          Cancel
        </button>
        <button id="confirmModalActionBtn" data-action="confirm-modal-proceed" class="h-8 px-4 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow">
          Remove Permanently
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastBox" class="fixed bottom-4 right-4 z-50 hidden px-4 py-2.5 rounded-xl bg-[#2c3539] border border-[#ff9f1c] text-xs font-semibold text-white shadow-2xl"></div>

  <script>
    const STORAGE_KEY = 'omnichart_v4_items';
    const CATEGORIES = ['All', 'Series & Anime', 'Movies', 'Games', 'Books'];
    const STATUSES = ['All', 'Watching', 'Completed', 'On Hold', 'Plan to Watch', 'Dropped'];

    // Recovery map for short anime titles that LiveChart's poster overlay overwrote with "TV (JP)Released"
    const LIVECHART_ID_TITLE_RECOVERY = {
      'lc-321': 'One Piece',
      'lc-3340': 'Bleach',
      'lc-3437': 'Death Note',
      'lc-3585': 'Naruto',
      'lc-3632': 'Dragon Ball Z',
      'lc-2478': 'Black Clover',
      'lc-3612': 'Black Lagoon',
      'lc-9984': 'A Will Eternal',
      'lc-10257': 'Chainsaw Man',
      'lc-12428': 'DAN DA DAN',
      'lc-9680': 'JUJUTSU KAISEN',
      'lc-10491': 'JUJUTSU KAISEN 0',
      'lc-11320': 'Solo Leveling',
      'lc-11247': 'Oshi no Ko',
      'lc-3169': 'Vinland Saga',
      'lc-10456': 'SPY x FAMILY',
      'lc-10042': 'Cyberpunk: Edgerunners',
      'lc-10687': 'BLUE LOCK',
      'lc-11352': 'Kaiju No. 8',
      'lc-3418': 'Cowboy Bebop',
      'lc-8349': 'Dr. STONE',
      'lc-8355': 'Fire Force',
      'lc-412': 'Tokyo Ghoul',
      'lc-9793': 'Tower of God',
      'lc-3168': 'Dororo',
      'lc-956': 'PSYCHO-PASS',
      'lc-3109': 'Goblin Slayer',
      'lc-1241': 'Blue Exorcist',
      'lc-154': 'Noragami',
      'lc-1481': 'Drifters',
      'lc-11916': 'WIND BREAKER',
      'lc-10891': 'Chained Soldier',
      'lc-11714': 'Go! Go! Loser Ranger!',
      'lc-10281': 'Record of Ragnarok',
      'lc-10754': 'Record of Ragnarok II',
      'lc-13083': 'Record of Ragnarok III',
      'lc-11088': 'Baki Hanma',
      'lc-11380': 'Baki Hanma Season 2',
      'lc-4603': 'Mo Dao Zu Shi',
      'lc-10083': 'Scissor Seven Season 2',
      'lc-10512': 'JoJo\'s Bizarre Adventure: Stone Ocean',
      'lc-10156': 'Horimiya',
      'lc-9501': 'ID: INVADED',
      'lc-1344': 'Charlotte',
      'lc-1280': 'Death Parade',
      'lc-2585': 'DEVILMAN crybaby',
      'lc-3582': 'Elfen Lied',
      'lc-3583': 'Tengen Toppa Gurren Lagann',
      'lc-1936': 'Mob Psycho 100',
      'lc-784': 'Overlord',
      'lc-2574': 'Overlord II',
      'lc-3206': 'Overlord III',
      'lc-752': 'Plastic Memories',
      'lc-1956': 'Your Name.',
      'lc-3399': 'A Silent Voice',
      'lc-401': 'Akame ga Kill!',
      'lc-3627': 'Future Diary',
      'lc-12331': 'Dragon Raja',
      'lc-11377': 'Undead Unluck',
      'lc-12917': 'SAKAMOTO DAYS',
      'lc-12697': 'Gachiakuta',
      'lc-12601': 'ZENSHU',
      'lc-12651': 'Tougen Anki',
      'lc-11225': 'Ninja Kamui',
      'lc-9563': 'Kengan Ashura',
      'lc-1580': 'Kakegurui'
    };

    const state = {
      items: [],
      view: 'library',
      category: 'All',
      status: 'All',
      search: '',
      sort: 'rating-desc',
      cardTab: {},
      bulkMode: false,
      selectedIds: new Set(),
      pendingConfirmFn: null,
      enrichRunning: false,
      enrichStopRequested: false,
      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth()
    };

    function isBrokenTitle(title) {
      if (!title) return true;
      const t = title.trim();
      return /^(?:TV|THTR|OVA|ONA|Movie|Special|Streaming|Sub|Dub|RLS|EP\d+)[\s\S]*?(?:Released|Upcoming|Airing|20\d{2})\s*$/i.test(t);
    }

    function sanitizeAndRecoverItems(list) {
      let changed = false;
      for (const item of list) {
        // Strip old example dates that were only meant as prompt examples
        if (
          item.consumedDate === '3-6-2026 to 18-6-2026' ||
          item.consumedDate === '3-6-2026 to 1-1-2027' ||
          (item.id === 'seed-2' && item.consumedDate === '14-10-2026')
        ) {
          item.consumedDate = '';
          changed = true;
        }
        // Recover known broken LiveChart titles
        if (isBrokenTitle(item.title) && LIVECHART_ID_TITLE_RECOVERY[item.id]) {
          item.title = LIVECHART_ID_TITLE_RECOVERY[item.id];
          changed = true;
        }
      }
      return changed;
    }

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            state.items = parsed;
            if (sanitizeAndRecoverItems(state.items)) {
              saveItems();
            }
            return;
          }
        }
      } catch (e) {}
      state.items = [];
      saveItems();
    }

    function saveItems() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
      } catch (e) {}
    }

    function showToast(msg) {
      const el = document.getElementById('toastBox');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.add('hidden'), 2800);
    }

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function makeFallbackPoster(title) {
      const clean = (title || 'Media').slice(0, 22);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="360" viewBox="0 0 240 360">
        <rect width="240" height="360" fill="#0d0e11"/>
        <rect x="10" y="10" width="220" height="340" rx="10" fill="#2c3539" stroke="#3d494f" stroke-width="2"/>
        <text x="120" y="180" text-anchor="middle" fill="#ff9f1c" font-family="sans-serif" font-size="15" font-weight="bold">${esc(clean)}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function parseSingleDDMMYYYY(str) {
      if (!str) return null;
      const m = str.trim().match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
      if (!m) return null;
      const d = parseInt(m[1], 10);
      const mo = parseInt(m[2], 10);
      const y = parseInt(m[3], 10);
      if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
      return { day: d, month: mo - 1, year: y, label: `${d}-${mo}-${y}` };
    }

    function parseDateOrRange(raw) {
      if (!raw || !raw.trim()) return null;
      const parts = raw.trim().split(/\s+to\s+/i);
      if (parts.length === 1) {
        const single = parseSingleDDMMYYYY(parts[0]);
        return single ? { type: 'single', start: single, end: null } : null;
      }
      const start = parseSingleDDMMYYYY(parts[0]);
      const end = parseSingleDDMMYYYY(parts[1]);
      if (start && end) {
        if (start.day === end.day && start.month === end.month && start.year === end.year) {
          return { type: 'single', start, end: null };
        }
        return { type: 'range', start, end };
      }
      return null;
    }

    function getFilteredItems() {
      const q = state.search.trim().toLowerCase();
      const filtered = state.items.filter((item) => {
        if (state.category !== 'All' && item.category !== state.category) return false;
        if (state.status !== 'All' && item.status !== state.status) return false;
        if (q) {
          const hay = `${item.title} ${item.studio || ''} ${(item.genres || []).join(' ')} ${item.consumedDate || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (state.sort === 'rating-desc') return (b.rating || 0) - (a.rating || 0);
        if (state.sort === 'updated-desc') return (b.updatedAt || 0) - (a.updatedAt || 0);
        if (state.sort === 'title-asc') return (a.title || '').localeCompare(b.title || '');
        if (state.sort === 'progress-desc') return (b.progress || 0) - (a.progress || 0);
        return 0;
      });

      return filtered;
    }

    function renderNavigation() {
      document.getElementById('menuLibraryCount').textContent = state.items.length;
      const datedCount = state.items.filter((i) => parseDateOrRange(i.consumedDate)).length;
      document.getElementById('menuCalendarCount').textContent = datedCount;

      const libBtn = document.getElementById('menuViewLibrary');
      const calBtn = document.getElementById('menuViewCalendar');
      if (state.view === 'library') {
        libBtn.className = 'w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-bold bg-[#ff9f1c] text-[#0d0e11]';
        calBtn.className = 'w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium text-slate-200 hover:bg-[#364146] mt-0.5';
      } else {
        calBtn.className = 'w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-bold bg-[#ff9f1c] text-[#0d0e11] mt-0.5';
        libBtn.className = 'w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium text-slate-200 hover:bg-[#364146]';
      }

      const catNav = document.getElementById('categoryNav');
      catNav.innerHTML = CATEGORIES.map((cat) => {
        const active = state.category === cat;
        return `<button
          data-action="set-category"
          data-category="${esc(cat)}"
          class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${
            active
              ? 'bg-[#ff9f1c] text-[#0d0e11] shadow'
              : 'bg-[#2c3539] text-slate-300 hover:text-white border border-[#3d494f]'
          }"
        >${esc(cat)}</button>`;
      }).join('');

      const statusTabs = document.getElementById('statusTabs');
      statusTabs.innerHTML = STATUSES.map((st) => {
        const count = state.items.filter((i) => {
          if (state.category !== 'All' && i.category !== state.category) return false;
          return st === 'All' ? true : i.status === st;
        }).length;
        const active = state.status === st;
        return `<button
          data-action="set-status"
          data-status="${esc(st)}"
          class="px-2.5 py-1 rounded-lg text-xs font-medium whitespace-nowrap flex items-center gap-1.5 transition ${
            active
              ? 'bg-[#ff9f1c] text-[#0d0e11] font-bold'
              : 'bg-[#0d0e11] text-slate-300 hover:text-white border border-[#3d494f]'
          }"
        >
          <span>${esc(st)}</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded ${active ? 'bg-[#0d0e11]/20 text-[#0d0e11]' : 'bg-[#2c3539] text-slate-400'}">${count}</span>
        </button>`;
      }).join('');

      const bulkToolbar = document.getElementById('bulkToolbar');
      const bulkModeBtn = document.getElementById('bulkModeBtn');
      if (state.bulkMode) {
        bulkToolbar.classList.remove('hidden');
        bulkModeBtn.className = 'h-8 px-2.5 rounded-lg bg-rose-600 text-white border border-rose-400 text-xs font-bold flex items-center gap-1.5 transition';
        document.getElementById('bulkSelectedCount').textContent = `${state.selectedIds.size} selected`;
      } else {
        bulkToolbar.classList.add('hidden');
        bulkModeBtn.className = 'h-8 px-2.5 rounded-lg bg-[#0d0e11] hover:bg-rose-950/60 border border-[#3d494f] hover:border-rose-500/60 text-xs text-slate-200 hover:text-rose-200 flex items-center gap-1.5 transition';
      }
    }

    function renderLibrary() {
      const grid = document.getElementById('mediaGrid');
      const items = getFilteredItems();

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-[#2c3539] border border-[#3d494f] rounded-2xl p-10 text-center space-y-3">
            <div class="text-base font-bold text-white">Your library is empty or no entries match your filter</div>
            <p class="text-xs text-slate-400">Click + Add Media or use Import in the top-right to load your LiveChart JSON.</p>
            <button data-action="open-add-modal" class="px-4 py-2 rounded-lg bg-[#ff9f1c] text-[#0d0e11] font-bold text-xs">+ Add Media</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map((item) => {
        const rating = Number(item.rating || 0);
        const isMasterpiece = rating >= 9;
        const progress = Number(item.progress || 0);
        const total = Math.max(1, Number(item.totalUnits || 1));
        const pct = Math.min(100, Math.round((progress / total) * 100));
        const activeTab = state.cardTab[item.id] || (item.notes ? 'notes' : 'synopsis');
        const bodyText = activeTab === 'notes'
          ? (item.notes || 'No review notes added yet.')
          : (item.synopsis || 'No synopsis available.');
        const isSelected = state.selectedIds.has(item.id);
        const posterSrc = item.image || makeFallbackPoster(item.title);

        return `
          <article
            data-card-id="${esc(item.id)}"
            data-action="${state.bulkMode ? 'toggle-select-card' : ''}"
            class="group relative bg-[#2c3539] rounded-xl overflow-hidden flex flex-col border transition ${
              state.bulkMode
                ? isSelected
                  ? 'border-rose-500 ring-2 ring-rose-500/40 cursor-pointer'
                  : 'border-[#3d494f] hover:border-rose-400/60 cursor-pointer'
                : 'border-[#3d494f] hover:border-[#ff9f1c]/60'
            }"
          >
            <!-- Top Title Header -->
            <div class="px-3.5 py-2.5 bg-[#0d0e11]/60 border-b border-[#3d494f] flex items-start justify-between gap-2">
              <div class="min-w-0 flex items-start gap-2">
                ${state.bulkMode ? `
                  <input
                    type="checkbox"
                    ${isSelected ? 'checked' : ''}
                    class="mt-0.5 w-4 h-4 accent-rose-500 rounded pointer-events-none"
                  />
                ` : ''}
                <div class="min-w-0">
                  <h3 class="font-bold text-sm text-white truncate" title="${esc(item.title)}">${esc(item.title)}</h3>
                  <div class="flex flex-wrap items-center gap-1.5 text-[11px] text-slate-400 mt-0.5">
                    <span>${esc(item.category || 'Series & Anime')}</span>
                    <span>•</span>
                    <span class="${item.releaseDate && item.releaseDate !== 'TBA' ? 'text-slate-200 font-medium' : ''}">${esc(item.releaseDate || 'TBA')}</span>
                    ${item.consumedDate ? `
                      <span>•</span>
                      <button
                        data-action="jump-to-item-date"
                        data-date="${esc(item.consumedDate)}"
                        class="text-[#ff9f1c] hover:underline font-medium"
                        title="View on Calendar"
                      >📅 ${esc(item.consumedDate)}</button>
                    ` : ''}
                  </div>
                </div>
              </div>

              ${!state.bulkMode ? `
                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition shrink-0">
                  <button
                    data-action="edit-item"
                    data-id="${esc(item.id)}"
                    title="Edit"
                    class="p-1 rounded bg-[#2c3539] hover:bg-[#364146] text-slate-300 hover:text-white text-xs"
                  >✎</button>
                  <button
                    data-action="delete-item"
                    data-id="${esc(item.id)}"
                    title="Remove"
                    class="p-1 rounded bg-[#2c3539] hover:bg-rose-600 text-slate-300 hover:text-white text-xs"
                  >✕</button>
                </div>
              ` : ''}
            </div>

            <!-- Studio & Genres Ribbon -->
            <div class="px-3.5 py-1.5 bg-[#0d0e11]/30 border-b border-[#3d494f] flex items-center justify-between gap-2 text-[11px]">
              <span class="font-semibold text-slate-200 truncate" title="${esc(item.studio || 'Unknown Studio')}">${esc(item.studio || 'Unknown Studio')}</span>
              <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
                ${(item.genres || []).slice(0, 3).map((g) => `
                  <span class="px-1.5 py-0.5 rounded bg-[#0d0e11] text-slate-300 border border-[#3d494f] whitespace-nowrap">${esc(g)}</span>
                `).join('')}
              </div>
            </div>

            <!-- Card Body -->
            <div class="flex flex-1 min-h-[185px]">
              <div class="relative w-[125px] shrink-0 bg-[#0d0e11] border-r border-[#3d494f]">
                <img
                  src="${esc(posterSrc)}"
                  alt="${esc(item.title)}"
                  data-fallback-title="${esc(item.title)}"
                  class="poster-img w-full h-full object-cover"
                />
                <button
                  data-action="edit-item"
                  data-id="${esc(item.id)}"
                  title="Click to rate or edit"
                  class="absolute top-2 left-2 px-2 py-0.5 rounded-md text-xs font-extrabold shadow-md flex items-center gap-1 ${
                    isMasterpiece
                      ? 'bg-[#ff9f1c] text-[#0d0e11]'
                      : rating > 0
                        ? 'bg-[#0d0e11]/90 text-white border border-[#ff9f1c]/60'
                        : 'bg-[#0d0e11]/80 text-slate-400 border border-[#3d494f]'
                  }"
                >
                  <span>★</span>
                  <span>${rating > 0 ? rating.toFixed(1).replace(/\.0$/, '') : '–'}</span>
                </button>
              </div>

              <div class="flex-1 flex flex-col justify-between p-3 min-w-0">
                <div class="space-y-1.5">
                  <div class="flex items-center gap-1 border-b border-[#3d494f]/70 pb-1">
                    <button
                      data-action="switch-card-tab"
                      data-id="${esc(item.id)}"
                      data-tab="notes"
                      class="text-[11px] font-semibold px-2 py-0.5 rounded ${
                        activeTab === 'notes' ? 'bg-[#0d0e11] text-[#ff9f1c]' : 'text-slate-400 hover:text-white'

    function renderCalendar() {
      const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];
      document.getElementById('calendarMonthLabel').textContent = `${monthNames[state.calMonth]} ${state.calYear}`;

      const eventsByKey = new Map();
      const loggedMonths = new Map();

      for (const item of state.items) {
        const parsed = parseDateOrRange(item.consumedDate);
        if (!parsed) continue;

        if (parsed.type === 'single') {
          const { day, month, year } = parsed.start;
          const key = `${year}-${month}-${day}`;
          if (!eventsByKey.has(key)) eventsByKey.set(key, []);
          eventsByKey.get(key).push({ item, badge: 'DAY' });
          loggedMonths.set(`${year}-${month}`, `${monthNames[month].slice(0, 3)} ${year}`);
        } else if (parsed.type === 'range') {
          const s = parsed.start;
          const e = parsed.end;
          const sKey = `${s.year}-${s.month}-${s.day}`;
          const eKey = `${e.year}-${e.month}-${e.day}`;
          if (!eventsByKey.has(sKey)) eventsByKey.set(sKey, []);
          eventsByKey.get(sKey).push({ item, badge: 'START' });
          if (!eventsByKey.has(eKey)) eventsByKey.set(eKey, []);
          eventsByKey.get(eKey).push({ item, badge: 'END' });
          loggedMonths.set(`${s.year}-${s.month}`, `${monthNames[s.month].slice(0, 3)} ${s.year}`);
          loggedMonths.set(`${e.year}-${e.month}`, `${monthNames[e.month].slice(0, 3)} ${e.year}`);
        }
      }

      const jumpBar = document.getElementById('calendarJumpBar');
      const monthEntries = Array.from(loggedMonths.entries());
      if (monthEntries.length > 0) {
        jumpBar.innerHTML = `<span class="text-xs text-slate-400 mr-1">Logged Months:</span>` +
          monthEntries.map(([ym, label]) => {
            const [y, m] = ym.split('-').map(Number);
            const active = y === state.calYear && m === state.calMonth;
            return `<button
              data-action="cal-jump-ym"
              data-year="${y}"
              data-month="${m}"
              class="px-2.5 py-1 rounded-lg text-xs font-semibold transition ${
                active
                  ? 'bg-[#ff9f1c] text-[#0d0e11]'
                  : 'bg-[#2c3539] text-slate-300 hover:text-white border border-[#3d494f]'
              }"
            >${esc(label)}</button>`;
          }).join('');
      } else {
        jumpBar.innerHTML = `<span class="text-xs text-slate-400">Click + on any calendar day or edit an entry to add a Date / Range.</span>`;
      }

      const firstDayWeek = new Date(state.calYear, state.calMonth, 1).getDay();
      const daysInMonth = new Date(state.calYear, state.calMonth + 1, 0).getDate();
      const today = new Date();

      const cells = [];
      for (let i = 0; i < firstDayWeek; i++) {
        cells.push(`<div class="min-h-[115px] rounded-xl bg-[#0d0e11]/40 border border-[#3d494f]/30"></div>`);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${state.calYear}-${state.calMonth}-${d}`;
        const dayEvents = eventsByKey.get(key) || [];
        const isToday = today.getFullYear() === state.calYear && today.getMonth() === state.calMonth && today.getDate() === d;
        const dateStr = `${d}-${state.calMonth + 1}-${state.calYear}`;

        cells.push(`
          <div class="min-h-[115px] rounded-xl bg-[#2c3539] border ${isToday ? 'border-[#ff9f1c]' : 'border-[#3d494f]'} p-2 flex flex-col justify-between">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold ${isToday ? 'px-1.5 py-0.5 rounded bg-[#ff9f1c] text-[#0d0e11]' : 'text-slate-300'}">${d}</span>
              <button
                data-action="add-on-date"
                data-date="${dateStr}"
                title="Add Media on ${dateStr}"
                class="w-5 h-5 rounded bg-[#0d0e11] hover:bg-[#ff9f1c] text-slate-300 hover:text-[#0d0e11] text-xs font-bold leading-none"
              >+</button>
            </div>
            <div class="space-y-1 mt-1.5 overflow-y-auto max-h-[82px] no-scrollbar">
              ${dayEvents.map(({ item, badge }) => {
                const badgeCls = badge === 'DAY'
                  ? 'bg-[#ff9f1c] text-[#0d0e11]'
                  : badge === 'START'
                    ? 'bg-emerald-400 text-[#0d0e11]'
                    : 'bg-sky-400 text-[#0d0e11]';
                return `
                  <button
                    data-action="edit-item"
                    data-id="${esc(item.id)}"
                    class="w-full text-left p-1 rounded bg-[#0d0e11] hover:bg-[#364146] border border-[#3d494f] flex items-center gap-1.5 text-[11px]"
                  >
                    <span class="px-1 rounded text-[9px] font-extrabold ${badgeCls}">${badge}</span>
                    <span class="truncate text-slate-100 font-medium">${esc(item.title)}</span>
                  </button>

    // =========================================================================
    // BUILT-IN AUTOMATIC ANILIST GRAPHQL BATCH METADATA ENRICHER
    // Populates Studio / Creator, Release Date, Genres & Synopsis automatically
    // =========================================================================
    function cleanHtmlSynopsis(str) {
      if (!str) return '';
      return str
        .replace(/<br\s*\/?>/gi, ' ')
        .replace(/<\/?[^>]+(>|$)/g, '')
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/&amp;/g, '&')
        .replace(/\s*\((?:Source|Written by):[^)]+\)\s*$/i, '')
        .replace(/\s*\[(?:Source|Written by):[^\]]+\]\s*$/i, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function formatSeasonYear(season, year, fallbackYear) {
      const y = year || fallbackYear;
      if (season && y) {
        const cap = season.charAt(0).toUpperCase() + season.slice(1).toLowerCase();
        return `${cap} ${y}`;
      }
      if (y) return String(y);
      return 'TBA';
    }

    async function enrichMissingMetadata(forceAll = false) {
      if (state.enrichRunning) return;

      // First run ID title recovery
      sanitizeAndRecoverItems(state.items);

      const targets = state.items.filter((item) => {
        if (isBrokenTitle(item.title)) return false;
        if (forceAll) return true;
        const missingStudio = !item.studio || item.studio === 'Unknown Studio';
        const missingDate = !item.releaseDate || item.releaseDate === 'TBA';
        const missingSyn = !item.synopsis || item.synopsis.trim() === '';
        const missingGenres = !Array.isArray(item.genres) || item.genres.length === 0;
        return missingStudio || missingDate || missingSyn || missingGenres;
      });

      if (targets.length === 0) {
        showToast('All entries with valid titles already have metadata!');
        renderAll();
        return;
      }

      state.enrichRunning = true;
      state.enrichStopRequested = false;

      const banner = document.getElementById('enrichBanner');
      const statusText = document.getElementById('enrichStatusText');
      const progressBar = document.getElementById('enrichProgressBar');
      banner.classList.remove('hidden');

      const BATCH_SIZE = 12;
      let processed = 0;
      let updatedCount = 0;

      for (let i = 0; i < targets.length; i += BATCH_SIZE) {
        if (state.enrichStopRequested) break;

        const batch = targets.slice(i, i + BATCH_SIZE);
        const pct = Math.round((processed / targets.length) * 100);
        progressBar.style.width = `${pct}%`;
        statusText.textContent = `⚡ Auto-filling Studio, Release Date, Genres & Synopsis (${processed} / ${targets.length})...`;

        const queryFields = batch.map((item, idx) => {
          const safeSearch = item.title
            .replace(/\\/g, '\\\\')
            .replace(/"/g, '\\"')
            .replace(/\s+/g, ' ')
            .trim();
          return `q${idx}: Page(perPage: 1) {
            media(search: "${safeSearch}", type: ANIME) {
              title { english romaji }
              season
              seasonYear
              startDate { year }
              episodes
              format
              genres
              description(asHtml: false)
              studios { nodes { name isAnimationStudio } }
              coverImage { extraLarge large }
            }
          }`;
        });

        const fullQuery = `query {\n${queryFields.join('\n')}\n}`;

        try {
          const res = await fetch('https://graphql.anilist.co', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ query: fullQuery })
          });

          if (res.ok) {
            const json = await res.json();
            const data = json?.data || {};

            batch.forEach((item, idx) => {
              const media = data[`q${idx}`]?.media?.[0];
              if (!media) return;

              // Studio / Creator
              const studioNodes = media.studios?.nodes || [];
              const animStudios = studioNodes.filter((n) => n.isAnimationStudio).map((n) => n.name);
              const allStudios = studioNodes.map((n) => n.name);
              const chosenStudios = (animStudios.length > 0 ? animStudios : allStudios).slice(0, 2).join(', ');
              if (chosenStudios && (!item.studio || item.studio === 'Unknown Studio')) {
                item.studio = chosenStudios;
              }

              // Release Date
              const rel = formatSeasonYear(media.season, media.seasonYear, media.startDate?.year);
              if (rel !== 'TBA' && (!item.releaseDate || item.releaseDate === 'TBA')) {
                item.releaseDate = rel;
              }

              // Genres
              if (Array.isArray(media.genres) && media.genres.length > 0 && (!item.genres || item.genres.length === 0)) {
                item.genres = media.genres.slice(0, 4);
              }

              // Synopsis
              const cleanDesc = cleanHtmlSynopsis(media.description);
              if (cleanDesc && (!item.synopsis || item.synopsis.trim() === '')) {
                item.synopsis = cleanDesc;
              }

              // Poster fallback if missing
              if (!item.image && (media.coverImage?.extraLarge || media.coverImage?.large)) {
                item.image = media.coverImage.extraLarge || media.coverImage.large;
              }

              // Total episodes if missing
              if (media.episodes && (!item.totalUnits || item.totalUnits === 12)) {
                item.totalUnits = media.episodes;
                if (item.status === 'Completed') item.progress = media.episodes;
              }

              if (media.format === 'MOVIE') {
                item.category = 'Movies';
                item.unitName = 'movie';
                item.totalUnits = 1;
                if (item.status === 'Completed') item.progress = 1;
              }

              updatedCount++;
            });

            saveItems();
            renderLibrary();
          }
        } catch (err) {
          // Continue next batch smoothly
        }

        processed += batch.length;
        await new Promise((r) => setTimeout(r, 650));
      }

      progressBar.style.width = '100%';
      state.enrichRunning = false;
      setTimeout(() => banner.classList.add('hidden'), 1200);
      saveItems();
      renderAll();
      showToast(`Enriched ${updatedCount} entries with Studio, Release Date & Synopsis!`);
    }

    function saveMediaFromModal() {
      const title = document.getElementById('fieldTitle').value.trim();
      if (!title) {
        showToast('Please enter a title');
        return;
      }
      const id = document.getElementById('fieldId').value || ('id-' + Date.now());
      const category = document.getElementById('fieldCategory').value;
      const status = document.getElementById('fieldStatus').value;
      const rating = Math.min(10, Math.max(0, parseFloat(document.getElementById('fieldRating').value) || 0));
      const totalUnits = Math.max(1, parseInt(document.getElementById('fieldTotalUnits').value, 10) || 1);
      let progress = Math.max(0, parseInt(document.getElementById('fieldProgress').value, 10) || 0);
      if (status === 'Completed') progress = totalUnits;

      const unitName = category === 'Movies' ? 'movie' : category === 'Books' ? 'chs' : category === 'Games' ? 'hrs' : 'eps';
      const genres = document.getElementById('fieldGenres').value.split(',').map((s) => s.trim()).filter(Boolean);

      const entry = {
        id,
        title,
        category,
        status,
        rating,
        progress,
        totalUnits,
        unitName,
        studio: document.getElementById('fieldStudio').value.trim() || 'Unknown Studio',
        releaseDate: document.getElementById('fieldReleaseDate').value.trim() || 'TBA',
        consumedDate: document.getElementById('fieldConsumedDate').value.trim(),
        genres,
        image: document.getElementById('fieldImage').value.trim(),
        notes: document.getElementById('fieldNotes').value.trim(),
        synopsis: document.getElementById('fieldSynopsis').value.trim(),
        updatedAt: Date.now()
      };

      const idx = state.items.findIndex((i) => i.id === id);
      if (idx >= 0) {
        state.items[idx] = entry;
      } else {
        state.items.unshift(entry);
      }

      saveItems();
      document.getElementById('mediaModal').classList.add('hidden');
      renderAll();
      showToast('Saved entry');
    }

    // Fast Progressive Auto-Search inside Modal (AniList + Wikipedia)
    let searchTimer = null;
    let searchSeq = 0;

    async function runAutoSearch(query) {
      const q = query.trim();
      const box = document.getElementById('autoSearchResults');
      const statusEl = document.getElementById('autoSearchStatus');
      if (q.length < 2) {
        box.classList.add('hidden');
        statusEl.textContent = '';
        return;
      }

      const mySeq = ++searchSeq;
      statusEl.textContent = 'Searching...';
      const results = [];

      function renderDropdown() {
        if (mySeq !== searchSeq) return;
        if (results.length === 0) {
          box.innerHTML = `<div class="p-3 text-xs text-slate-400">No matches found.</div>`;
        } else {
          box.innerHTML = results.slice(0, 8).map((r, idx) => `
            <button
              type="button"
              data-action="pick-search-result"
              data-idx="${idx}"
              class="w-full p-2.5 text-left hover:bg-[#2c3539] flex items-center gap-3 transition"
            >
              <img src="${esc(r.image || makeFallbackPoster(r.title))}" class="w-10 h-14 object-cover rounded bg-[#2c3539] shrink-0" />
              <div class="min-w-0 flex-1">
                <div class="font-bold text-xs text-white truncate">${esc(r.title)}</div>
                <div class="text-[11px] text-[#ff9f1c]">${esc(r.category)} • ${esc(r.releaseDate || 'TBA')} • ${esc(r.studio || '')}</div>
                <div class="text-[11px] text-slate-400 truncate">${esc(r.synopsis || '')}</div>
              </div>
            </button>
          `).join('');
        }
        box.classList.remove('hidden');
      }

      window._lastSearchResults = results;

      const anilistPromise = fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          query: `query ($s: String) {
            Page(perPage: 5) {
              media(search: $s, type: ANIME) {
                title { english romaji }
                season
                seasonYear
                startDate { year }
                episodes
                format
                genres
                description(asHtml: false)
                studios { nodes { name isAnimationStudio } }
                coverImage { extraLarge large }
              }
            }
          }`,
          variables: { s: q }
        })
      })
        .then((r) => r.json())
        .then((json) => {
          for (const m of json?.data?.Page?.media || []) {
            const isMovie = m.format === 'MOVIE';
            const studioNodes = m.studios?.nodes || [];
            const anim = studioNodes.filter((n) => n.isAnimationStudio).map((n) => n.name);
            const studio = (anim.length ? anim : studioNodes.map((n) => n.name)).slice(0, 2).join(', ') || 'Unknown Studio';
            results.push({
              title: m.title?.english || m.title?.romaji || q,
              category: isMovie ? 'Movies' : 'Series & Anime',
              totalUnits: isMovie ? 1 : (m.episodes || 12),
              studio,
              releaseDate: formatSeasonYear(m.season, m.seasonYear, m.startDate?.year),
              genres: (m.genres || []).slice(0, 4),
              image: m.coverImage?.extraLarge || m.coverImage?.large || '',
              synopsis: cleanHtmlSynopsis(m.description)
            });
          }
          renderDropdown();
        })
        .catch(() => {});

      const wikiPromise = fetch(
        `https://en.wikipedia.org/w/api.php?action=query&origin=*&format=json&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=4&prop=pageimages|extracts&exintro=1&explaintext=1&exchars=260&piprop=thumbnail&pithumbsize=500`
      )
        .then((r) => r.json())
        .then((data) => {
          const pages = Object.values(data?.query?.pages || {});
          for (const p of pages) {
            const ext = p.extract || '';
            let cat = 'Movies';
            if (/anime|television series|tv series/i.test(ext)) cat = 'Series & Anime';
            else if (/video game/i.test(ext)) cat = 'Games';
            else if (/novel|book|manga/i.test(ext)) cat = 'Books';
            const ym = ext.match(/\b(19\d{2}|20\d{2})\b/);
            results.push({
              title: p.title.replace(/\s*\([^)]*\)\s*$/, ''),
              category: cat,
              totalUnits: cat === 'Movies' ? 1 : 12,
              studio: 'Wikipedia',
              releaseDate: ym ? ym[1] : 'TBA',
              genres: [],
              image: p.thumbnail?.source || '',
              synopsis: ext
            });
          }
          renderDropdown();
        })
        .catch(() => {});

      await Promise.allSettled([anilistPromise, wikiPromise]);
      if (mySeq === searchSeq) {
        statusEl.textContent = '';
        renderDropdown();
      }
    }

    document.addEventListener('click', (e) => {

      const action = btn.dataset.action;

      if (action === 'toggle-tome-menu') {

        dropdown.classList.add('hidden');

        state.category = btn.dataset.category;
        renderAll();

        state.status = btn.dataset.status;
        renderAll();
      } else if (action === 'clear-library-search') {
        state.search = '';
        document.getElementById('librarySearchInput').value = '';
        btn.classList.add('hidden');

      } else if (action === 'save-media') {

        if (item) openMediaModal(item);

        e.stopPropagation();
        const id = btn.dataset.id;
        state.items = state.items.filter((i) => i.id !== id);
        state.selectedIds.delete(id);
        saveItems();
        renderAll();
        showToast('Entry removed');
      } else if (action === 'step-progress') {
        e.stopPropagation();
        const item = state.items.find((i) => i.id === btn.dataset.id);
        if (!item) return;
        const delta = parseInt(btn.dataset.delta, 10);
        const total = Math.max(1, Number(item.totalUnits || 1));
        item.progress = Math.min(total, Math.max(0, Number(item.progress || 0) + delta));
        if (item.progress === total) item.status = 'Completed';
        item.updatedAt = Date.now();
        saveItems();
        renderAll();
      } else if (action === 'switch-card-tab') {
        e.stopPropagation();
        state.cardTab[btn.dataset.id] = btn.dataset.tab;
        renderLibrary();
      } else if (action === 'jump-to-item-date') {
        e.stopPropagation();
        const parsed = parseDateOrRange(btn.dataset.date);
        if (parsed) {
          state.calYear = parsed.start.year;
          state.calMonth = parsed.start.month;
          state.view = 'calendar';
          renderAll();
        }
      } else if (action === 'cal-prev-month') {
        state.calMonth--;
        if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
        renderCalendar();
      } else if (action === 'cal-next-month') {
        state.calMonth++;
        if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
        renderCalendar();
      } else if (action === 'cal-today') {
        const now = new Date();
        state.calYear = now.getFullYear();
        state.calMonth = now.getMonth();
        renderCalendar();
      } else if (action === 'cal-jump-ym') {
        state.calYear = parseInt(btn.dataset.year, 10);
        state.calMonth = parseInt(btn.dataset.month, 10);
        renderCalendar();
      } else if (action === 'add-on-date') {
        openMediaModal(null, btn.dataset.date);
      } else if (action === 'fill-today-date') {
        const d = new Date();
        document.getElementById('fieldConsumedDate').value = `${d.getDate()}-${d.getMonth() + 1}-${d.getFullYear()}`;
      } else if (action === 'append-date-to') {
        const inp = document.getElementById('fieldConsumedDate');
        if (inp.value && !inp.value.includes('to')) inp.value = inp.value.trim() + ' to ';
        inp.focus();
      } else if (action === 'pick-search-result') {
        const r = (window._lastSearchResults || [])[parseInt(btn.dataset.idx, 10)];
        if (r) {
          document.getElementById('fieldTitle').value = r.title || '';
          document.getElementById('fieldCategory').value = r.category || 'Series & Anime';
          document.getElementById('fieldTotalUnits').value = r.totalUnits || 12;
          document.getElementById('fieldProgress').value = document.getElementById('fieldStatus').value === 'Completed' ? (r.totalUnits || 12) : 0;
          document.getElementById('fieldStudio').value = r.studio || '';
          document.getElementById('fieldReleaseDate').value = r.releaseDate || '';
          document.getElementById('fieldGenres').value = (r.genres || []).join(', ');
          document.getElementById('fieldImage').value = r.image || '';
          document.getElementById('fieldSynopsis').value = r.synopsis || '';
          updateModalPosterPreview(r.image || '');
          document.getElementById('autoSearchResults').classList.add('hidden');
        }
      } else if (action === 'enrich-library') {
        dropdown.classList.add('hidden');
        enrichMissingMetadata(false);
      } else if (action === 'stop-enrich') {
        state.enrichStopRequested = true;
      } else if (action === 'export-json') {
        const blob = new Blob([JSON.stringify(state.items, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `omnichart-export-${state.items.length}.json`;
        a.click();
      } else if (action === 'toggle-bulk-mode') {
        state.bulkMode = !state.bulkMode;
        if (!state.bulkMode) state.selectedIds.clear();
        state.view = 'library';
        dropdown.classList.add('hidden');
        renderAll();
      } else if (action === 'toggle-select-card') {
        const id = btn.dataset.cardId;
        if (!id) return;
        if (state.selectedIds.has(id)) state.selectedIds.delete(id);
        else state.selectedIds.add(id);
        renderAll();
      } else if (action === 'bulk-select-visible') {
        getFilteredItems().forEach((i) => state.selectedIds.add(i.id));
        renderAll();
      } else if (action === 'bulk-deselect-all') {
        state.selectedIds.clear();
        renderAll();
      } else if (action === 'bulk-select-broken') {
        state.selectedIds.clear();
        state.items.forEach((i) => {
          if (isBrokenTitle(i.title)) state.selectedIds.add(i.id);
        });
        renderAll();
        showToast(`Selected ${state.selectedIds.size} broken title entries`);
      } else if (action === 'bulk-select-unrated') {
        state.selectedIds.clear();
        state.items.forEach((i) => {
          if (!i.rating || Number(i.rating) === 0) state.selectedIds.add(i.id);
        });
        renderAll();
        showToast(`Selected ${state.selectedIds.size} unrated entries`);
      } else if (action === 'bulk-delete-selected') {
        const count = state.selectedIds.size;
        if (count === 0) {
          showToast('Select at least 1 entry first');
          return;
        }
        openConfirmModal(
          `Remove ${count} Selected Entries?`,
          `This will permanently remove the ${count} selected entries from your OmniChart library.`,
          () => {
            state.items = state.items.filter((i) => !state.selectedIds.has(i.id));
            state.selectedIds.clear();
            saveItems();
            renderAll();
            showToast(`Removed ${count} entries`);
          }
        );
      } else if (action === 'bulk-delete-filtered') {
        const visible = getFilteredItems();
        if (visible.length === 0) return;
        openConfirmModal(
          `Remove All ${visible.length} Shown Entries?`,
          `This will remove all ${visible.length} entries currently matching your active category/status/search filter.`,
          () => {
            const removeSet = new Set(visible.map((i) => i.id));
            state.items = state.items.filter((i) => !removeSet.has(i.id));
            state.selectedIds.clear();
            saveItems();
            renderAll();
            showToast(`Removed ${visible.length} entries`);
          }
        );
      } else if (action === 'bulk-wipe-all') {
        if (state.items.length === 0) return;
        const total = state.items.length;
        openConfirmModal(
          `Wipe Entire Library (${total} Entries)?`,
          `This will clear all ${total} entries from OmniChart so you can start fresh or import a clean JSON file.`,
          () => {
            state.items = [];
            state.selectedIds.clear();
            state.bulkMode = false;
            saveItems();
            renderAll();
            showToast('Library wiped clean');
          }
        );
      } else if (action === 'close-confirm-modal') {
        document.getElementById('confirmModal').classList.add('hidden');
        state.pendingConfirmFn = null;
      } else if (action === 'confirm-modal-proceed') {
        document.getElementById('confirmModal').classList.add('hidden');
        if (typeof state.pendingConfirmFn === 'function') state.pendingConfirmFn();
        state.pendingConfirmFn = null;
      }
    });

    document.getElementById('librarySearchInput').addEventListener('input', (e) => {
      state.search = e.target.value;
      document.getElementById('clearLibrarySearchBtn').classList.toggle('hidden', !state.search);
      renderLibrary();
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      state.sort = e.target.value;
      renderLibrary();
    });

    document.getElementById('autoSearchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => runAutoSearch(e.target.value), 150);
    });

    document.getElementById('fieldImage').addEventListener('input', (e) => {
      updateModalPosterPreview(e.target.value);
    });

    document.getElementById('posterUploadInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        document.getElementById('fieldImage').value = reader.result;
        updateModalPosterPreview(reader.result);
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('importFileInput').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (!Array.isArray(imported)) throw new Error('Invalid JSON');
          const byId = new Map(state.items.map((i) => [i.id, i]));
          for (const raw of imported) {
            if (!raw || !raw.title) continue;
            const id = raw.id || ('imp-' + Math.random().toString(36).slice(2, 9));
            const recoveredTitle = isBrokenTitle(raw.title) && LIVECHART_ID_TITLE_RECOVERY[id]
              ? LIVECHART_ID_TITLE_RECOVERY[id]
              : raw.title;
            byId.set(id, {
              id,
              title: recoveredTitle,
              category: raw.category || 'Series & Anime',
              status: raw.status || 'Completed',
              rating: Number(raw.rating || 0),
              progress: Number(raw.progress ?? raw.totalUnits ?? 1),
              totalUnits: Math.max(1, Number(raw.totalUnits || 12)),
              unitName: raw.unitName || 'eps',
              studio: raw.studio || 'Unknown Studio',
              releaseDate: raw.releaseDate || 'TBA',
              consumedDate: raw.consumedDate || '',
              genres: Array.isArray(raw.genres) ? raw.genres : [],
              image: raw.image || '',
              synopsis: raw.synopsis || '',
              notes: raw.notes || '',
              updatedAt: raw.updatedAt || Date.now()
            });
          }
          state.items = Array.from(byId.values());
          saveItems();
          renderAll();
          showToast(`Imported ${imported.length} entries — starting metadata enrichment...`);
          // Automatically enrich missing Studio, Synopsis, Release Date & Genres!
          enrichMissingMetadata(false);
        } catch (err) {
          showToast('Failed to parse JSON file');
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    // Boot & auto-enrich if any imported items are missing Studio/Synopsis/ReleaseDate
    loadItems();
    renderAll();
    if (state.items.some((i) => !isBrokenTitle(i.title) && (i.studio === 'Unknown Studio' || !i.synopsis || i.releaseDate === 'TBA'))) {
      enrichMissingMetadata(false);
    }
  </script>
</body>
</html>
